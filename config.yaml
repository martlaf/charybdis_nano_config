parse_config:
  preprocess: true

  # Canadian Multilingual Standard mappings
  token_aliases:
    # --- SYM accents ---
    "AltGr+/": "´"
    "[": "^"
    "AltGr+[": "`"
    "Sft+[": "¨"
    "]": "ç"


draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0

  combo_side_offset: 4
  draw_combos: true

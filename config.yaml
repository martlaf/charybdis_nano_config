parse_config:
  preprocess: true
  draw_key_sides: true

  svg_extra_style: |
    svg.keymap {
      font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 10px;
      font-weight: bold;
    }
    
    text.label {
      stroke: #dfdfde;
      stroke-width: 12;
      stroke-linejoin: round;
    }
    
    rect.combo, rect.combo-separate {
      opacity: 0.95;
      stroke: #c9cccf;
      stroke-width: 0.5;
      fill: #d7eaed;
    }
    path.combo {
      stroke-dasharray: 4, 4;
      stroke-opacity: 0.3;
    }
    
    rect.held, rect.combo.held {
      fill: #ebdada;
    }
    
    .trans.tap, .ghost.tap {
      opacity: 0.5;
    }
    
    .shifted {
      translate: -9px 3px;
      opacity: 0.3;
    }
    
    .toggle.shifted {
      translate: -12px 17px;
      opacity: 1.0;
    }
    .toggle.hold {
      translate: 12px -25px;
    }
    
    .text_with_symbol.tap {
      translate: -1px 1px;
    }
    .text_with_symbol.shifted {
      translate: 8px 13px;
      font-size: 8px;
      opacity: 1.0;
    } 
    
    .combo.text_with_symbol.tap {
      translate: -1px 1px;
    }
    .combo.text_with_symbol.shifted {
      translate: 7px 5px;
      font-size: 8px;
      opacity: 1.0;
    } 

  layer_legend_map:
    MouseScroll: $$mdi:pan$$
    MouseScrollHorizontal: $$mdi:pan-horizontal$$
    MouseScrollVertical: $$mdi:pan-vertical$$

  raw_binding_map:
    "&mkp LCLK": $$mdi:mouse-left-click$$
    "&mkp RCLK": $$mdi:mouse-right-click$$
    "&mkp MCLK": $$mdi:mouse-scroll-wheel$$
    "&msc SCRL_LEFT": $$mdi:pan-left$$
    "&msc SCRL_RIGHT": $$mdi:pan-right$$
    "&msc SCRL_UP": $$mdi:pan-up$$
    "&msc SCRL_DOWN": $$mdi:pan-down$$
    "&caps_word": $$mdi:apple-keyboard-caps$$$$mdi:alpha-w-box-outline$$

    '&mmv MOVE_UP':
      tap: $$mdi:mouse-outline$$
      shifted: $$mdi:arrow-up$$
      type: text_with_symbol
    '&mmv MOVE_DOWN':
      tap: $$mdi:mouse-outline$$
      shifted: $$mdi:arrow-down$$
      type: text_with_symbol
    '&mmv MOVE_LEFT':
      tap: $$mdi:mouse-outline$$
      shifted: $$mdi:arrow-left$$
      type: text_with_symbol
    '&mmv MOVE_RIGHT':
      tap: $$mdi:mouse-outline$$
      shifted: $$mdi:arrow-right$$
      type: text_with_symbol

  # Canadian Multilingual Standard mappings
  zmk_keycode_map:
    # CMS Symbols
    RA(SLASH): "´"
    LEFT_BRACKET: "^"
    RA(LEFT_BRACKET): "`"
    RS(LEFT_BRACKET): "¨"
    RIGHT_BRACKET: "ç"
    RA(RIGHT_BRACKET): "~"
    RA(COMMA): "<"
    RA(PERIOD): ">"
    RA(N7): "{"
    RA(N8): "}"
    RA(N9): "["
    RA(N0): "]"
    CARET: "?"
    GRAVE: "/"
    RA(GRAVE): "|"
    TILDE: '\'
    SLASH: "É"


    # Arrows
    UP: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$
    PG_UP: $$mdi:transfer-up$$
    PAGE_UP: $$mdi:transfer-up$$
    PG_DN: $$mdi:transfer-down$$
    PAGE_DN: $$mdi:transfer-down$$


    # Functions
    C_BRI_UP: $$mdi:brightness-7$$
    C_BRIGHTNESS_INC: $$mdi:brightness-7$$
    C_BRI_DN: $$mdi:brightness-5$$
    C_BRIGHTNESS_DEC: $$mdi:brightness-5$$

    C_NEXT: $$mdi:skip-next$$
    C_PREV: $$mdi:skip-previous$$
    C_PLAY_PAUSE: $$mdi:play-pause$$
    C_PP: $$mdi:play-pause$$

    C_MUTE: $$mdi:volume-off$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOLUME_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-low$$
    C_VOLUME_DOWN: $$mdi:volume-low$$
    F20: $$mdi:microphone-off$$

    PRINTSCREEN: $$mdi:monitor-screenshot$$

    LS(LC(Z)): $$mdi:redo-variant$$
    LC(Z): $$mdi:undo-variant$$
    LC(C): $$mdi:content-copy$$
    LC(X): $$mdi:content-cut$$
    LC(V): $$mdi:content-paste$$


    #
    ENTER:
      type: enter
      tap: $$mdi:keyboard-return$$
    ESC: $$mdi:keyboard-esc$$
    ESCAPE: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    LS(TAB): $$mdi:keyboard-tab-reverse$$
    SPACE: $$mdi:keyboard-space$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    DELETE: $$mdi:backspace-reverse-outline$$
    DEL: $$mdi:backspace-reverse-outline$$
    CAPSLOCK: $$mdi:apple-keyboard-caps$$
    CAPS: $$mdi:apple-keyboard-caps$$

    # Symbols
    EXCLAMATION: "!"
    EXCL: "!"
    AT_SIGN: "@"
    AT: "@"
    HASH: "#"
    POUND: "#"
    DOLLAR: $
    DLLR: $
    PERCENT: "%"
    PRCNT: "%"
    AMPERSAND: "&"
    AMPS: "&"
    ASTERISK: "*"
    ASTRK: "*"
    STAR: "*"
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL: "="
    PLUS: +
    MINUS: "-"
    UNDERSCORE: _
    UNDER: _
    QUESTION: "?"
    QMARK: "?"
    BACKSLASH: '\'
    BSLH: '\'
    PIPE: "|"
    NON_US_BACKSLASH: \
    PIPE2: "|"
    NON_US_BSLH: "|"
    SEMICOLON:
      tap: ";"
      shifted: ":"
    SEMI:
      tap: ";"
      shifted: ":"
    COLON: ":"
    SINGLE_QUOTE: "'"
    SQT: "'"
    APOSTROPHE: <
    APOS: .
    DOUBLE_QUOTES: '"'
    DQT: '"'

    LESS_THAN: <
    LT: <
    PERIOD: "."
    DOT:
      tap: "."
      shifted: '"'
    COMMA:
      tap: ","
      shifted: "'"
    GREATER_THAN: ">"
    GT: ">"
    LEFT_BRACE: "{"
    LBRC: "{"
    RBKT:
      tap: "]"
      shifted: "}"
    RIGHT_BRACE: "}"
    RBRC: "}"
    NON_US_HASH: "#"
    NUHS: "#"
    TILDE2: "~"

draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0

  combo_side_offset: 4
  draw_combos: true
